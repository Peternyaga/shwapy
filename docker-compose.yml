version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: shwapy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shwapy
      MYSQL_USER: shwapy
      MYSQL_PASSWORD: shwapy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: shwapy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
